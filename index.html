<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>профиль</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <header class="header">
    <div class="logo">UserProfileApp</div>
    <button class="btn btn-theme">Сменить тему</button>
  </header>

  <main class="container">
    <div class="profile-card">
      <div class="avatar-wrapper">
        <img src="https://i.pinimg.com/736x/8d/1a/ac/8d1aacfc44d766425fc52d4e10fbc075.jpg" alt="Аватар профілю" class="avatar">
      </div>
      
      <h2 class="profile-name">Виктория</h2>
      <p class="profile-bio">Информация про меня.</p>

      <div class="controls">
        <input type="text" class="name-input" placeholder="Новое имя">
        <button class="btn btn-change-name">Сменить имя</button>
      </div>
    </div>
  </main>

  <script src="index.js"></script>
</body>
</html>
