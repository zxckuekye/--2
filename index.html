<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Міні-сторінка профілю</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <header class="header">
    <div class="logo">UserProfileApp</div>
    <button class="btn btn-theme">Змінити тему</button>
  </header>

  <main class="container">
    <div class="profile-card">
      <div class="avatar-wrapper">
        <img src="https://via.placeholder.com/120" alt="Аватар профілю" class="avatar">
      </div>
      
      <h2 class="profile-name">Вікторія</h2>
      <p class="profile-bio">Junior Front-End Developer. Захоплююся веб-розробкою та інтерактивними інтерфейсами.</p>

      <div class="controls">
        <input type="text" class="name-input" placeholder="Нове ім'я">
        <button class="btn btn-change-name">Змінити ім'я</button>
      </div>
    </div>
  </main>

  <script src="index.js"></script>
</body>
</html>
